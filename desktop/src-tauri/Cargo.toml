[package]
name = "confeitaria-desktop"
version = "2.0.0"
description = "Confeitaria - interface desktop (Tauri)"
authors = ["DWM System Developer"]
edition = "2021"

[lib]
# O sufixo `_lib` evita conflito de nome entre a lib e o binário no Windows.
name = "confeitaria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
